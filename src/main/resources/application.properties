spring.application.name=demo-project

# Load key=value pairs from src/.env as a property source so ${DB_USERNAME} etc. resolve
spring.config.import=optional:file:./src/.env[.properties]

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.error.include-message=always